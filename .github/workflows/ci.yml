name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # version comes from package.json "packageManager"

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

  # PgStore tests stay opt-in — isolated job, doesn't gate the main suite.
  pg:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: recurr
          POSTGRES_PASSWORD: recurr
          POSTGRES_DB: recurr
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U recurr"
          --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL: postgres://recurr:recurr@127.0.0.1:5432/recurr
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # "pkg..." = the package plus its workspace dependencies (@recurr-dev/core),
      # built in topological order — filtered build alone misses core's dist/.
      - run: pnpm --filter @recurr-dev/store... build
      - run: pnpm --filter @recurr-dev/store test
