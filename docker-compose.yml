services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: recurr
      POSTGRES_PASSWORD: recurr
      POSTGRES_DB: recurr
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recurr"]
      interval: 2s
      timeout: 5s
      retries: 15

  recurr-server:
    build:
      context: .
      dockerfile: Dockerfile.server
    environment:
      DATABASE_URL: postgres://recurr:recurr@postgres:5432/recurr
      PORT: "4780"
    ports:
      - "4780:4780"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
